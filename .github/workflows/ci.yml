name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest   # Docker 내장 → Testcontainers(Flyway MySQL 검증) 실행됨
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false   # 테스트만 실행 → 체크아웃 토큰을 git 설정에 남기지 않음

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Run tests
        run: ./gradlew test
