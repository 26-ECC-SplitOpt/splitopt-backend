<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 700" width="960" height="700" font-family="'Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <path d="M0,0 L10,3.5 L0,7 Z" fill="#334155"/>
    </marker>
    <marker id="arrowDash" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <path d="M0,0 L10,3.5 L0,7 Z" fill="#94a3b8"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="960" height="700" fill="#ffffff"/>

  <!-- Title -->
  <text x="480" y="38" text-anchor="middle" font-size="20" font-weight="700" fill="#0f172a">SplitOpt Backend — Layered Architecture</text>
  <text x="480" y="58" text-anchor="middle" font-size="12" fill="#64748b">Spring Boot 4 · Java 21 · JPA · Flyway · MySQL 8</text>

  <!-- Central flow: down arrows -->
  <line x1="480" y1="126" x2="480" y2="168" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="480" y1="234" x2="480" y2="270" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="480" y1="336" x2="480" y2="372" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="480" y1="438" x2="480" y2="474" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="480" y1="540" x2="480" y2="598" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 1. Client -->
  <rect x="320" y="70" width="320" height="56" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="480" y="96" text-anchor="middle" font-size="16" font-weight="700" fill="#0f172a">Client</text>
  <text x="480" y="114" text-anchor="middle" font-size="12" fill="#475569">모바일 · 웹 앱 (REST 호출)</text>

  <!-- 2. Controller -->
  <rect x="320" y="170" width="320" height="64" rx="10" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.5"/>
  <text x="480" y="198" text-anchor="middle" font-size="16" font-weight="700" fill="#0f172a">Controller</text>
  <text x="480" y="218" text-anchor="middle" font-size="12" fill="#475569">REST API · 공통 응답(ApiResponse&lt;T&gt;)</text>

  <!-- 3. Service -->
  <rect x="320" y="272" width="320" height="64" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
  <text x="480" y="300" text-anchor="middle" font-size="16" font-weight="700" fill="#0f172a">Service</text>
  <text x="480" y="320" text-anchor="middle" font-size="12" fill="#475569">비즈니스 로직 · 정산 최적화(그리디 네팅)</text>

  <!-- 4. Repository -->
  <rect x="320" y="374" width="320" height="64" rx="10" fill="#fefce8" stroke="#ca8a04" stroke-width="1.5"/>
  <text x="480" y="402" text-anchor="middle" font-size="16" font-weight="700" fill="#0f172a">Repository</text>
  <text x="480" y="422" text-anchor="middle" font-size="12" fill="#475569">Spring Data JPA</text>

  <!-- 5. Domain -->
  <rect x="320" y="476" width="320" height="64" rx="10" fill="#faf5ff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="480" y="504" text-anchor="middle" font-size="16" font-weight="700" fill="#0f172a">Domain (JPA Entities)</text>
  <text x="480" y="524" text-anchor="middle" font-size="12" fill="#475569">User · Group · Expense · Settlement · Budget</text>

  <!-- 6. MySQL cylinder -->
  <path d="M350,604 a130,16 0 0,0 260,0 v56 a130,16 0 0,1 -260,0 Z" fill="#f1f5f9" stroke="#0f766e" stroke-width="1.5"/>
  <ellipse cx="480" cy="604" rx="130" ry="16" fill="#e2f4f1" stroke="#0f766e" stroke-width="1.5"/>
  <text x="480" y="636" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">MySQL 8</text>
  <text x="480" y="654" text-anchor="middle" font-size="12" fill="#475569">Railway · 운영 DB</text>

  <!-- Left: Global (cross-cutting) -->
  <rect x="40" y="176" width="214" height="196" rx="10" fill="#f8fafc" stroke="#64748b" stroke-width="1.3" stroke-dasharray="5,3"/>
  <text x="147" y="200" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">Global (공통 모듈)</text>
  <text x="60" y="234" font-size="12" fill="#475569">• GlobalExceptionHandler</text>
  <text x="60" y="262" font-size="12" fill="#475569">• ErrorCode · BusinessException</text>
  <text x="60" y="290" font-size="12" fill="#475569">• ApiResponse&lt;T&gt;</text>
  <text x="60" y="318" font-size="12" fill="#475569">• BaseEntity · JPA Auditing</text>
  <text x="147" y="354" text-anchor="middle" font-size="11" fill="#94a3b8">모든 레이어에 적용 (횡단 관심사)</text>
  <line x1="254" y1="300" x2="318" y2="304" stroke="#94a3b8" stroke-width="1.3" stroke-dasharray="5,3" marker-end="url(#arrowDash)"/>

  <!-- Left-bottom: H2 -->
  <rect x="40" y="596" width="214" height="72" rx="10" fill="#f8fafc" stroke="#64748b" stroke-width="1.3" stroke-dasharray="5,3"/>
  <text x="147" y="624" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">H2 (in-memory)</text>
  <text x="147" y="644" text-anchor="middle" font-size="12" fill="#475569">로컬 개발 · 테스트 프로파일</text>
  <text x="147" y="660" text-anchor="middle" font-size="11" fill="#94a3b8">MySQL 호환 모드</text>

  <!-- Right: Flyway -->
  <rect x="706" y="470" width="214" height="80" rx="10" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5"/>
  <text x="813" y="498" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">Flyway</text>
  <text x="813" y="518" text-anchor="middle" font-size="12" fill="#475569">DB 마이그레이션 · V1 스키마</text>
  <text x="813" y="536" text-anchor="middle" font-size="11" fill="#94a3b8">운영 스키마 버전 관리</text>
  <path d="M760,550 C740,585 690,600 615,632" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrowDash)"/>
  <rect x="649" y="583" width="118" height="18" fill="#ffffff" opacity="0.95"/>
  <text x="708" y="596" text-anchor="middle" font-size="11" fill="#64748b">manages schema</text>

  <!-- Legend -->
  <rect x="706" y="606" width="200" height="72" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.3"/>
  <line x1="722" y1="630" x2="758" y2="630" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="766" y="634" font-size="12" fill="#475569">요청 · 데이터 흐름</text>
  <line x1="722" y1="658" x2="758" y2="658" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrowDash)"/>
  <text x="766" y="662" font-size="12" fill="#475569">스키마 · 공통 적용</text>
</svg>
