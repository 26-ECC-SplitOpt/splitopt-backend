spring.application.name=backend

# ===== JPA 공통 설정 =====
# dev 단계: 엔티티 변경 시 스키마 자동 반영 (운영 전 create/none 으로 조정)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ===== DB 설정 =====
# 현재는 별도 datasource 설정이 없어 내장 H2(인메모리)로 바로 실행된다.
# 팀 공통 MariaDB가 준비되면 아래 주석을 풀고 값을 채운다.
#
# spring.datasource.url=jdbc:mariadb://localhost:3306/splitopt
# spring.datasource.username=CHANGE_ME
# spring.datasource.password=CHANGE_ME
# spring.datasource.driver-class-name=org.mariadb.jdbc.Driver
# spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MariaDBDialect

# ===== H2 콘솔 (로컬 개발 확인용, 필요 시 /h2-console) =====
