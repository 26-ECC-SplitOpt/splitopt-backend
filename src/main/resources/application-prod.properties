# =====================================================================
# 운영(배포) 프로파일 — Render(웹서버) + Railway(MySQL)
# 활성화: 배포 환경변수 SPRING_PROFILES_ACTIVE=prod
# 접속 정보는 코드에 절대 넣지 않고 Render 환경변수로만 주입한다.
# =====================================================================

# ===== DataSource (환경변수 주입) =====
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===== JPA =====
# 스키마는 Flyway가 전적으로 관리 → Hibernate는 스키마에 손대지 않음(none)
# (validate로 두면 datetime 정밀도 등에서 오탐 가능성이 있어, 우선 none 권장.
#  실제 MySQL에서 타입 일치 확인 후 validate로 강화 가능.)
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
# application.properties의 로컬 전용 설정(data.sql 지연 실행)을 prod에서 되돌린다.
# true로 두면 Hibernate가 "DB 초기화 담당"으로 취급돼 Flyway와 서로를 기다리다
# 'Circular depends-on relationship between flyway and entityManagerFactory'로 부팅이 실패한다.
# prod는 data.sql을 쓰지 않으므로 지연 실행 자체가 불필요하다.
spring.jpa.defer-datasource-initialization=false

# ===== Flyway =====
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
# baseline-on-migrate는 쓰지 않음: 빈 DB엔 V1이 정상 적용되고,
# 이력 없는 기존 DB는 (실수 방지 위해) baseline을 일회성 수동 절차로 처리한다.

# ===== 로컬 전용 설정 차단 =====
# application.properties는 모든 프로파일의 베이스라 로컬 편의 설정이 prod로 샌다.
# 스키마·데이터는 Flyway가 전담하므로 data.sql/schema.sql은 prod에서 실행 금지.
spring.sql.init.mode=never
# H2 콘솔이 운영에 노출되지 않도록 명시적으로 차단.
spring.h2.console.enabled=false

# ===== JWT =====
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}
jwt.refresh-expiration-ms=${JWT_REFRESH_EXPIRATION_MS:604800000}
# ===== CORS =====
# 운영에서는 Render 환경변수 CORS_ALLOWED_ORIGINS로 덮어쓸 수 있다(쉼표 구분).
# 배포 도메인이 바뀌면 재배포 없이 환경변수만 고치면 된다.
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,https://splitopt.netlify.app}
