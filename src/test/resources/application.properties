# =====================================================================
# 테스트 프로파일 — 내장 H2(MySQL 호환 모드) + Flyway 미사용
# 매 테스트마다 엔티티 기반으로 스키마를 새로 생성(create-drop)한다.
# (운영 MySQL 스키마 검증은 Flyway/실DB에서 별도로 수행)
# =====================================================================

spring.datasource.url=jdbc:h2:mem:testdb;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.properties.hibernate.auto_quote_keyword=true
spring.jpa.show-sql=false

spring.flyway.enabled=false

jwt.secret=splitopt-test-jwt-secret-key-32bytes-min
jwt.expiration-ms=3600000
jwt.refresh-expiration-ms=604800000
spring.sql.init.mode=never

# CORS — test 클래스패스의 이 파일이 main의 application.properties를 가리므로 여기에도 둔다.
# 운영과 같은 값으로 맞춰 CorsConfigTest가 실제 설정과 같은 조건에서 검증되게 한다.
cors.allowed-origins=http://localhost:5173,https://splitopt.netlify.app
