# =====================================================================
# 운영(배포) 프로파일 — Render(웹서버) + Railway(MySQL)
# 활성화: 배포 환경변수 SPRING_PROFILES_ACTIVE=prod
# 접속 정보는 코드에 절대 넣지 않고 Render 환경변수로만 주입한다.
# =====================================================================

# ===== DataSource (환경변수 주입) =====
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===== JPA =====
# 스키마는 Flyway가 전적으로 관리 → Hibernate는 스키마에 손대지 않음(none)
# (validate로 두면 datetime 정밀도 등에서 오탐 가능성이 있어, 우선 none 권장.
#  실제 MySQL에서 타입 일치 확인 후 validate로 강화 가능.)
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# ===== Flyway =====
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
# 이미 객체가 있는 DB에도 안전하게 적용
spring.flyway.baseline-on-migrate=true
