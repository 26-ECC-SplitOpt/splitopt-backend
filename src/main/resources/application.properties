spring.application.name=backend

# =====================================================================
# 기본(default) 프로파일 = 로컬 개발/테스트 : 내장 H2 + Flyway 미사용
# 운영 배포는 prod 프로파일 사용 (application-prod.properties)
#   → Render 환경변수 SPRING_PROFILES_ACTIVE=prod 로 활성화
# =====================================================================

# ===== JPA (로컬) =====
# 로컬은 엔티티 기반 자동 생성으로 빠르게 개발
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
# 예약어 테이블/컬럼명(groups, user 등) 자동 인용 — H2/MySQL 모두에서 스키마 생성 안전
spring.jpa.properties.hibernate.auto_quote_keyword=true

# ===== Flyway =====
# 로컬/테스트(H2)에서는 비활성화 — 마이그레이션 SQL은 MySQL 전용이라 prod에서만 실행
spring.flyway.enabled=false

# ===== H2 콘솔 (로컬 확인용, 필요 시 주석 해제 후 /h2-console) =====
spring.h2.console.enabled=true

# data.sql이 테이블 생성(ddl-auto) 이후에 실행되도록 순서 보장
spring.jpa.defer-datasource-initialization=true

# ===== JWT =====
jwt.secret=splitopt-local-dev-jwt-secret-key-32bytes-min
jwt.expiration-ms=3600000
jwt.refresh-expiration-ms=604800000

# ===== CORS =====
# 프론트엔드 개발 서버(Vite)와 배포 사이트에서 오는 요청만 허용한다.
# 값을 코드가 아닌 설정에 둔 이유는 배포 도메인이 바뀌거나 오타가 있었을 때
# 코드 수정 없이 환경변수(CORS_ALLOWED_ORIGINS)만 바꿔 대응하기 위해서다.
cors.allowed-origins=http://localhost:5173,https://splitopt.netlify.app
